<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SheShield · Shared journey</title>
<style>body{font:16px system-ui;background:#f5f5f8;color:#171821;margin:0;padding:24px}main{max-width:540px;margin:auto}section{background:white;border-radius:24px;padding:24px;margin:20px 0}h1{font-size:32px}svg{width:100%;height:300px;background:#eeebff;border-radius:16px}p{line-height:1.6}small{color:#666875}</style>
<main><small>SHESHIELD · SHARED JOURNEY</small><h1 id="title">Connecting…</h1><section><svg viewBox="0 0 400 300"><polyline id="route" fill="none" stroke="#6554d9" stroke-width="4"/><circle id="position" r="7" fill="#137c71"/></svg><p id="status"></p><small id="age"></small></section><p>This private link expires after two hours. It shares the recorded position during this journey.</p></main>
<script>async function refresh(){try{const r=await fetch(location.pathname+'/data');const d=await r.json();if(!r.ok)throw Error(d.message);document.querySelector('#title').textContent=d.destination;document.querySelector('#status').textContent=(d.mode==='REHEARSAL'?'Rehearsal · ':'')+d.state.replaceAll('_',' ');const xs=d.geometry.map(p=>p[0]),ys=d.geometry.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const xy=p=>[20+(p[0]-minX)/(maxX-minX||1)*360,280-(p[1]-minY)/(maxY-minY||1)*260];document.querySelector('#route').setAttribute('points',d.geometry.map(xy).map(p=>p.join(',')).join(' '));if(d.location){const p=xy([d.location.longitude,d.location.latitude]);document.querySelector('#position').setAttribute('cx',p[0]);document.querySelector('#position').setAttribute('cy',p[1]);document.querySelector('#age').textContent='Last update '+new Date(d.location.timestamp_ms).toLocaleString();}else{document.querySelector('#age').textContent='Waiting for a recorded position';}}catch(e){document.querySelector('#status').textContent=e.message;}}refresh();setInterval(refresh,10000);</script></html>
